# Déploiement auto-hébergé du chat : Postgres, Electric, l'application et Caddy, sans service
# externe. Les valeurs viennent de `.env` (voir `.env.example`). Le script de `initdb` ne s'exécute
# que sur un volume de données vide.
#
# Seul Caddy est publié, en HTTPS : l'application ne se joint pas en `http://` direct, où le
# navigateur limiterait ses connexions et refuserait les cookies de session.

services:
  db:
    image: postgres:17
    command:
      - postgres
      - -c
      - wal_level=logical
      # Un slot de réplication abandonné ne retient pas plus que ce volume de journal.
      - -c
      - max_slot_wal_keep_size=4GB
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?}
      ELECTRIC_DB_PASSWORD: ${ELECTRIC_DB_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'chat']
      interval: 2s
      retries: 30
    restart: unless-stopped

  electric:
    image: electricsql/electric:1.8.1
    environment:
      DATABASE_URL: postgresql://electric:${ELECTRIC_DB_PASSWORD}@db:5432/chat?sslmode=disable
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:?}
      # La publication et ses tables sont créées par le schéma ; le rôle d'Electric n'en possède aucune.
      ELECTRIC_MANUAL_TABLE_PUBLISHING: 'true'
      ELECTRIC_STORAGE_DIR: /var/lib/electric/persistent
    volumes:
      - electric_data:/var/lib/electric/persistent
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: apps/chat/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chat_app:${CHAT_DB_PASSWORD}@db:5432/chat?sslmode=disable
      ELECTRIC_URL: http://electric:3000
      # Seul Caddy joint l'application : l'adresse du client est celle qu'il transmet.
      WICA_BEHIND_CADDY: '1'
    depends_on:
      db:
        condition: service_healthy
      electric:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    environment:
      WICA_DOMAIN: ${WICA_DOMAIN:-localhost}
    ports:
      - '${WICA_HTTP_PORT:-80}:80'
      - '${WICA_HTTPS_PORT:-443}:443'
      - '${WICA_HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db_data:
  electric_data:
  # Certificats et clé de l'autorité locale de Caddy.
  caddy_data:
  caddy_config:
