# Self-hosted deployment of the hub: Postgres, Electric, the application and Caddy, with no
# external service. Values come from `.env` (see `.env.example`). The `initdb` script creates the
# roles on an empty data volume; `migrate` brings the schema up to date at each start, before
# Electric, which needs its publication.
#
# Only Caddy is published, over HTTPS: the application is not reached over direct `http://`, where
# the browser would limit its connections and refuse the session cookies.

services:
  db:
    image: postgres:17
    command:
      - postgres
      - -c
      - wal_level=logical
      # An abandoned replication slot retains no more than this much journal.
      - -c
      - max_slot_wal_keep_size=4GB
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?}
      ELECTRIC_DB_PASSWORD: ${ELECTRIC_DB_PASSWORD:?}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'chat']
      interval: 2s
      retries: 30
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: apps/hub/Dockerfile
    command: ['node', 'node/migrate.mjs']
    environment:
      DATABASE_URL: postgresql://chat_app:${CHAT_DB_PASSWORD}@db:5432/chat?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  electric:
    image: electricsql/electric:1.8.1
    environment:
      DATABASE_URL: postgresql://electric:${ELECTRIC_DB_PASSWORD}@db:5432/chat?sslmode=disable
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:?}
      # The publication and its tables are created by the schema; Electric's role owns none of them.
      ELECTRIC_MANUAL_TABLE_PUBLISHING: 'true'
      ELECTRIC_STORAGE_DIR: /var/lib/electric/persistent
    volumes:
      - electric_data:/var/lib/electric/persistent
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: apps/hub/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chat_app:${CHAT_DB_PASSWORD}@db:5432/chat?sslmode=disable
      ELECTRIC_URL: http://electric:3000
      # Only Caddy reaches the application: the client address, the protocol and the host are
      # the ones it forwards.
      WICA_BEHIND_CADDY: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
      electric:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    environment:
      WICA_DOMAIN: ${WICA_DOMAIN:-localhost}
    ports:
      - '${WICA_HTTP_PORT:-80}:80'
      - '${WICA_HTTPS_PORT:-443}:443'
      - '${WICA_HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db_data:
  electric_data:
  # Certificates and key of Caddy's local authority.
  caddy_data:
  caddy_config:
